name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Streamlit
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.streamlit
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/churn-dashboard-streamlit:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/churn-dashboard-streamlit:${{ github.sha }}
      
      - name: Build and push FastAPI
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.fastapi
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/churn-dashboard-fastapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/churn-dashboard-fastapi:${{ github.sha }}