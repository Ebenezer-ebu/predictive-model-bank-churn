version: '3.8'

services:
  streamlit:
    image: ebuka1234/churn-dashboard-streamlit:latest
    container_name: churn-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  fastapi:
    image: ebuka1234/churn-dashboard-fastapi:latest
    container_name: churn-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped